[project]
name = "algohub-web-department"
version = "0.1.0"
description = "Autonomous multi-agent system that turns a web project request into a planned, coded, tested, secured, deployed and monitored web app."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "redis>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.1,<25.0",
    "pgvector>=0.3,<1.0",
    "python-ulid>=3.0,<4.0",
    "litellm>=1.50,<2.0",
    "jinja2>=3.1,<4.0",
    "pyyaml>=6.0,<7.0",
    "docker>=7.1,<8.0",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint-postgres>=3.1,<4.0",
    "openapi-spec-validator>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "coverage[toml]>=7.6,<8.0",
    "types-PyYAML>=6.0,<7.0",
    "types-docker>=7.1,<8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["web_department*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not slow'"
markers = [
    "slow: needs a real Docker daemon and a real, reachable LLM provider; excluded by default, run with `pytest -m slow` or `make test-e2e`.",
]

[tool.coverage.run]
source = ["web_department"]
branch = true
omit = ["web_department/db/migrations/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
